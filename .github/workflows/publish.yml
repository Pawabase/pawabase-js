name: publish
# Publishes to npm when you push a tag like v0.1.0 (the tag must match package.json).
# Uses npm trusted publishing (OIDC): no token. Configure it once on npmjs.com under
# the package's Settings -> Trusted Publisher: Pawabase / pawabase-js / publish.yml.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write           # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - name: The tag matches the package version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run typecheck && npm test
      - run: npm publish --access public --provenance
